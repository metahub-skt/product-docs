# GitHub Pages(Jekyll) 설정 — 공개 사이트 https://metahub-skt.github.io/product-docs/
# 이 디렉터리(docs/product/site/)가 유일한 원본이다. GitHub 리포 metahub-skt/product-docs 는 출력물이며
# scripts/ci/publish-product-docs.sh 가 통째로 덮어쓴다 — 거기서 직접 고치지 않는다.
title: MetaHub
description: 데이터 레이크를 위한 통합 메타데이터·카탈로그·정책 플랫폼
lang: ko
# GitHub Pages 가 기본 제공하는 테마(별도 설치 없음). 레이아웃 이름은 default.
# 레이아웃은 _layouts/default.html 이 테마 원본을 덮는다(타이틀 홈 링크·브레드크럼), 스타일은 assets/css/style.scss 가
# 테마를 import 한 뒤 덧붙인다 — 테마 버전을 바꾸면 두 파일을 원본과 다시 맞춘다.
theme: jekyll-theme-cayman
markdown: kramdown
# .md 는 발행 스크립트가 front matter(layout 만)를 넣어 올리므로 그대로 렌더된다.
# GitHub Pages 기본 플러그인 jekyll-titles-from-headings 는 front matter 에 title 이 없으면 첫 H1 을 page.title 로
# 삼고, cayman 헤더(project-name)가 그것을 그대로 쓴다 — 상세 페이지에서 위 헤더와 아래 H1 이 같은 글자로
# 두 번 보이던 실제 원인(2026-10-22). 끄면 헤더는 site.title("MetaHub") 로 떨어지고 본문 H1 만 페이지 제목이 된다.
titles_from_headings:
  enabled: false
exclude:
  - README.md
